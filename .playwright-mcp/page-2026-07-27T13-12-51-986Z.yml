xt.focus(); else arr[0].focus(); } if (e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey)) { e.preventDefault(); const prev = arr[idx - 1]; if (prev) prev.focus(); else arr[arr.length - 1].focus(); } if (e.key === 'Escape') { // focus back on parent link.focus(); } }); }); console.log('Navigation Demo — fully interactive. ✦'); })();"