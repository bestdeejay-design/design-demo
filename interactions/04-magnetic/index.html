<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Cursor</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;min-height:100%;background:linear-gradient(135deg,#1a0e3a 0%,#0c0c0e 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;-webkit-font-smoothing:antialiased;cursor:none}
    .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;position:relative;overflow:hidden}

    .cursor{position:fixed;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#fff,#a29bfe);pointer-events:none;z-index:1000;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width 0.3s,height 0.3s,opacity 0.3s;box-shadow:0 0 12px rgba(162,155,254,0.6)}
    .cursor.is-hover{width:50px;height:50px;background:radial-gradient(circle,#6c5ce7,#fff);opacity:0.5}
    .cursor.is-press{width:30px;height:30px}

    h1{font-size:2.4rem;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,#fff,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;position:relative;z-index:2}
    p.sub{color:rgba(255,255,255,0.6);font-size:1.05rem;max-width:540px;margin:0 auto 40px;line-height:1.5;position:relative;z-index:2}

    .demo-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:40px;position:relative;z-index:2}
    .magnet{padding:14px 28px;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-radius:100px;color:white;font-size:0.95rem;font-weight:600;cursor:none;font-family:inherit;display:inline-flex;align-items:center;gap:8px;transition:background 0.2s,border-color 0.2s;position:relative;will-change:transform}
    .magnet.primary{background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-color:transparent}
    .magnet.outline{background:transparent;border:1.5px solid rgba(255,255,255,0.25)}
    .magnet:hover{background:rgba(255,255,255,0.15)}

    .icon-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;z-index:2}
    .icon-btn{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.8);cursor:none;font-family:inherit;transition:background 0.2s}
    .icon-btn:hover{background:rgba(255,255,255,0.15);color:white}
    .icon-btn.primary{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white;border-color:transparent}
    .icon-btn svg{width:22px;height:22px}

    .card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:left;position:relative;z-index:2;will-change:transform;cursor:none}
    .card-emoji{font-size:2rem;margin-bottom:12px}
    .card-title{font-weight:700;font-size:1.1rem;margin-bottom:4px}
    .card-sub{font-size:0.85rem;color:rgba(255,255,255,0.6)}
    .card-btn{position:absolute;top:24px;right:24px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:white;cursor:none;font-family:inherit;display:flex;align-items:center;justify-content:center}
    .card-btn svg{width:16px;height:16px}

    .back{position:fixed;top:20px;left:20px;z-index:10;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:rgba(255,255,255,0.7);font-size:0.78rem;text-decoration:none}
    .back svg{width:12px;height:12px}

    .strength{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);padding:6px;border-radius:100px;border:1px solid rgba(255,255,255,0.1);z-index:10}
    .strength button{background:transparent;border:none;padding:5px 12px;border-radius:100px;font-size:0.72rem;color:rgba(255,255,255,0.6);cursor:pointer;font-family:inherit}
    .strength button.is-active{background:rgba(108,92,231,0.5);color:white}

    /* Decorative blobs */
    .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;pointer-events:none}
    .blob-1{width:300px;height:300px;background:radial-gradient(#6c5ce7,transparent 70%);top:10%;left:10%}
    .blob-2{width:400px;height:400px;background:radial-gradient(#74b9ff,transparent 70%);bottom:10%;right:10%}
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="wrap">
    <h1>Magnetic Cursor</h1>
    <p class="sub">Курсор с магнитным притяжением. Кнопки и иконки притягиваются к курсору в радиусе.</p>

    <div class="demo-row">
      <button class="magnet primary" data-magnet>Купить сейчас</button>
      <button class="magnet" data-magnet>Узнать больше</button>
      <button class="magnet outline" data-magnet>Попробовать бесплатно</button>
    </div>

    <div class="icon-row">
      <button class="icon-btn primary" data-magnet>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
      <button class="icon-btn" data-magnet>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button class="icon-btn" data-magnet>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </button>
      <button class="icon-btn" data-magnet>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="icon-btn" data-magnet>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>

    <div class="card" data-magnet>
      <div class="card-emoji">✨</div>
      <div class="card-title">Карточка тоже магнитится</div>
      <div class="card-sub">Наведи курсор — вся карточка притянется к нему.</div>
      <button class="card-btn" data-magnet>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <a class="back" href="../../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Каталог
  </a>

  <div class="strength">
    <button class="is-active" data-str="0.4">Subtle</button>
    <button data-str="0.7">Strong</button>
    <button data-str="1.0">Extreme</button>
  </div>

  <div class="cursor" id="cursor"></div>

  <script>
    const cursor = document.getElementById('cursor');
    const mouse = { x: innerWidth/2, y: innerHeight/2 };
    let strength = 0.4;

    document.querySelectorAll('[data-str]').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('[data-str]').forEach(x => x.classList.remove('is-active'));
      b.classList.add('is-active');
      strength = +b.dataset.str;
    }));

    addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener('mousedown', () => cursor.classList.add('is-press'));
    addEventListener('mouseup', () => cursor.classList.remove('is-press'));

    // Magnetic effect
    document.querySelectorAll('[data-magnet]').forEach(el => {
      const strength = 0.5;
      let rect;
      function onMove(e) {
        rect = rect || el.getBoundingClientRect();
        const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        const dx = e.clientX - cx, dy = e.clientY - cy;
        const dist = Math.hypot(dx, dy);
        const maxDist = 100;
        if (dist < maxDist) {
          const f = (1 - dist / maxDist) * 0.5;
          el.style.transform = `translate(${dx * f}px, ${dy * f}px)`;
          cursor.classList.add('is-hover');
        }
      }
      function onLeave() {
        el.style.transform = '';
        cursor.classList.remove('is-hover');
        rect = null;
      }
      el.addEventListener('mousemove', onMove);
      el.addEventListener('mouseleave', onLeave);
    });

    function update() {
      cursor.style.left = mouse.x + 'px';
      cursor.style.top = mouse.y + 'px';
      requestAnimationFrame(update);
    }
    update();
  </script>
</body>
</html>
