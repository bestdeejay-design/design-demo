<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card — UI Component</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      width: 340px;
      overflow: hidden;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card-bg {
      height: 120px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    }
    .card-body {
      padding: 0 24px 24px;
      text-align: center;
      position: relative;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid #fff;
      margin: -40px auto 12px;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #8e8e93;
      position: relative;
    }
    .online {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      background: #34c759;
      border: 3px solid #fff;
      border-radius: 50%;
    }
    .name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .role {
      font-size: 0.85rem;
      color: #8e8e93;
      margin-bottom: 16px;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 20px;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .btn {
      display: inline-block;
      background: #6c5ce7;
      color: #fff;
      padding: 10px 32px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #5a4bd1; }
    .btn-outline {
      background: transparent;
      color: #6c5ce7;
      border: 2px solid #6c5ce7;
      margin-left: 8px;
    }
    .btn-outline:hover { background: #f0edff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-bg"></div>
    <div class="card-body">
      <div class="avatar">
        AK
        <span class="online"></span>
      </div>
      <div class="name">Alex Kuznetsov</div>
      <div class="role">Lead Product Designer</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-value">12.4K</div>
          <div class="stat-label">Followers</div>
        </div>
        <div class="stat">
          <div class="stat-value">86</div>
          <div class="stat-label">Projects</div>
        </div>
        <div class="stat">
          <div class="stat-value">2.1K</div>
          <div class="stat-label">Likes</div>
        </div>
      </div>
      <div>
        <button class="btn">Follow</button>
        <button class="btn btn-outline">Message</button>
      </div>
    </div>
  </div>
</body>
</html>
