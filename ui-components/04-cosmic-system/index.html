<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic System — UI Component</title>
  <meta name="description" content="An interactive solar system UI with parallax starfield, clickable planets and warp-speed effect.">
  <style>
    /* ── Reset & base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #02010a;
      color: #e8e8f0;
      -webkit-font-smoothing: antialiased;
      cursor: crosshair;
    }

    /* ── Starfield canvas ── */
    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* ── Nebula clouds ── */
    .nebula {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(108, 92, 231, 0.18), transparent 60%),
        radial-gradient(ellipse 50% 35% at 80% 70%, rgba(255, 71, 87, 0.12), transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 90%, rgba(0, 184, 148, 0.10), transparent 60%),
        radial-gradient(ellipse 40% 30% at 90% 20%, rgba(116, 185, 255, 0.14), transparent 60%);
      filter: blur(40px);
      opacity: 0.85;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Solar system container ── */
    .camera {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      transition: transform 1.4s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }
    .camera.warping {
      transition: transform 0.4s ease-in;
    }
    .system {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 50%;
      transition: transform 1.4s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }
    .system.warping {
      transition: transform 0.4s ease-in;
    }

    /* ── Sun ── */
    .sun {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      z-index: 5;
    }
    .sun-core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7c2, #ffd24c 35%, #ff9a3c 70%, #ff6b1a 100%);
      box-shadow:
        0 0 30px rgba(255, 200, 80, 0.8),
        0 0 60px rgba(255, 160, 60, 0.5),
        0 0 100px rgba(255, 120, 40, 0.3);
      animation: sunPulse 4s ease-in-out infinite;
    }
    .sun-glow {
      position: absolute;
      inset: -60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 180, 80, 0.3) 0%, transparent 60%);
      animation: sunGlow 6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    @keyframes sunGlow {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50%      { transform: scale(1.2); opacity: 1; }
    }

    /* ── Orbits ── */
    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: orbitRotate var(--orbit-period, 30s) linear infinite;
    }
    @keyframes orbitRotate {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ── Planets ── */
    .planet {
      position: absolute;
      top: 50%;
      left: 100%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      will-change: transform;
    }
    .planet::after {
      content: attr(data-name);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translate(-50%, 8px);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .planet:hover {
      transform: translate(-50%, -50%) scale(1.4);
    }
    .planet:hover::after {
      opacity: 1;
    }
    .planet.active {
      transform: translate(-50%, -50%) scale(1.6);
    }
    .planet.active::after {
      opacity: 1;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Planet bodies */
    .planet-mercury {
      width: 10px; height: 10px;
      background: radial-gradient(circle at 30% 30%, #c4b5a0, #8a7866 60%, #5a4a3a 100%);
      box-shadow: 0 0 8px rgba(196, 181, 160, 0.4);
    }
    .planet-venus {
      width: 18px; height: 18px;
      background: radial-gradient(circle at 30% 30%, #ffd9a0, #e89856 60%, #a05a2c 100%);
      box-shadow: 0 0 12px rgba(232, 152, 86, 0.5);
    }
    .planet-earth {
      width: 20px; height: 20px;
      background:
        radial-gradient(circle at 30% 30%, #6cc4ff, #2e7dd7 40%, #1a4d8a 80%, #0d2a52 100%);
      box-shadow: 0 0 14px rgba(108, 196, 255, 0.5);
    }
    .planet-earth::before {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background:
        radial-gradient(ellipse 8px 4px at 35% 30%, rgba(255, 255, 255, 0.5), transparent 70%),
        radial-gradient(ellipse 6px 3px at 65% 60%, rgba(255, 255, 255, 0.4), transparent 70%);
    }
    .planet-mars {
      width: 16px; height: 16px;
      background: radial-gradient(circle at 30% 30%, #ff8a6a, #c94424 60%, #7a2410 100%);
      box-shadow: 0 0 12px rgba(255, 138, 106, 0.5);
    }
    .planet-jupiter {
      width: 38px; height: 38px;
      background:
        linear-gradient(180deg,
          #d4a574 0%, #b8865a 18%, #e8c290 28%, #a8754a 45%,
          #d4a574 58%, #8a5a3a 75%, #c89870 88%, #6a4a2a 100%);
      box-shadow: 0 0 20px rgba(212, 165, 116, 0.5);
    }
    .planet-jupiter::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(ellipse 18px 2px at 50% 25%, rgba(120, 60, 30, 0.5), transparent 70%),
        radial-gradient(ellipse 20px 2px at 50% 55%, rgba(80, 40, 20, 0.5), transparent 70%),
        radial-gradient(ellipse 14px 2px at 50% 80%, rgba(120, 60, 30, 0.4), transparent 70%);
    }
    .planet-saturn {
      width: 30px; height: 30px;
      background: radial-gradient(circle at 30% 30%, #f0d8a0, #d4a564 50%, #8a6432 100%);
      box-shadow: 0 0 18px rgba(240, 216, 160, 0.5);
    }
    .planet-saturn::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 60px; height: 14px;
      transform: translate(-50%, -50%) rotate(-18deg);
      border-radius: 50%;
      background:
        radial-gradient(ellipse, transparent 45%, rgba(212, 165, 100, 0.7) 50%, rgba(180, 130, 70, 0.5) 65%, transparent 80%);
      pointer-events: none;
    }
    .planet-saturn::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 48px; height: 10px;
      transform: translate(-50%, -50%) rotate(-18deg);
      border-radius: 50%;
      background: radial-gradient(ellipse, transparent 48%, rgba(140, 90, 50, 0.5) 53%, transparent 70%);
      pointer-events: none;
    }

    /* ── Warp mode: stretch stars into streaks ── */
    body.warp #starfield {
      filter: blur(0.5px);
    }

    /* ── HUD: top bar ── */
    .hud {
      position: fixed;
      top: 0; left: 0;
      z-index: 10;
      padding: 24px 32px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 20px rgba(108, 92, 231, 0.5);
    }
    .hud .subtitle {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .hud .stats {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.65rem;
      color: rgba(116, 185, 255, 0.7);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .hud .stats .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: rgba(20, 18, 35, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 100px;
    }
    .hud .stats .stat-pill span {
      color: rgba(255, 255, 255, 0.5);
    }
    .hud .stats .stat-pill b {
      color: #fff;
      font-weight: 600;
    }

    /* ── Controls ── */
    .controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .ctrl-btn {
      background: rgba(20, 18, 35, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
      padding: 11px 22px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-btn:hover {
      background: rgba(108, 92, 231, 0.3);
      border-color: rgba(108, 92, 231, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3);
    }
    .ctrl-btn:active { transform: translateY(0) scale(0.97); }
    .ctrl-btn[hidden] { display: none; }
    .warp-icon {
      display: inline-block;
      width: 14px; height: 14px;
      animation: warpIdle 2s ease-in-out infinite;
    }
    @keyframes warpIdle {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50%      { transform: scale(1.15) rotate(180deg); }
    }

    /* ── Info panel ── */
    .info-panel {
      position: fixed;
      top: 50%;
      right: 36px;
      transform: translateY(-50%);
      z-index: 9;
      width: 320px;
      max-width: calc(100vw - 72px);
      background: rgba(15, 13, 28, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px 24px 22px;
      pointer-events: auto;
      opacity: 0;
      transform: translate(40px, -50%);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .info-panel.visible {
      opacity: 1;
      transform: translate(0, -50%);
    }
    .info-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .info-orb {
      width: 40px; height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 20px currentColor;
    }
    .info-titles h2 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .info-titles .info-type {
      font-size: 0.68rem;
      font-weight: 500;
      color: rgba(116, 185, 255, 0.85);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }
    .info-desc {
      font-size: 0.82rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 18px;
    }
    .info-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.62rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .close-btn {
      position: absolute;
      top: 14px; right: 14px;
      width: 24px; height: 24px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-family: inherit;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* ── Back button ── */
    .back-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(20, 18, 35, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.4);
      border-color: rgba(108, 92, 231, 0.5);
    }
    .back-btn svg { width: 14px; height: 14px; }

    /* ── View code (collapsed by default for cosmic scene) ── */
    .view-code-btn {
      position: fixed;
      top: 28px;
      right: 36px;
      z-index: 11;
      background: rgba(20, 18, 35, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .view-code-btn:hover {
      background: rgba(108, 92, 231, 0.25);
      border-color: rgba(108, 92, 231, 0.4);
      color: #fff;
    }
    .code-panel {
      position: fixed;
      top: 70px; right: 36px;
      z-index: 11;
      width: min(640px, calc(100vw - 72px));
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      opacity: 0;
      background: rgba(15, 13, 28, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .code-panel.open {
      max-height: 70vh;
      opacity: 1;
    }
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .code-panel pre {
      padding: 18px 20px;
      font-size: 0.7rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.75);
      overflow: auto;
      max-height: 60vh;
      white-space: pre;
      tab-size: 2;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.5px;
      transition: background 0.2s, color 0.2s;
    }
    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .hud { padding: 18px 20px; }
      .hud h1 { font-size: 0.9rem; letter-spacing: 2px; }
      .hud .coords { font-size: 0.62rem; }
      .hud .subtitle { display: none; }
      .info-panel {
        right: 16px;
        left: 16px;
        width: auto;
        max-width: none;
        top: auto;
        bottom: 96px;
        transform: translateY(20px);
      }
      .info-panel.visible {
        transform: translateY(0);
      }
      .back-btn {
        bottom: 16px; left: 16px;
        padding: 7px 12px; font-size: 0.72rem;
      }
      .view-code-btn {
        top: 18px; right: 20px;
        padding: 6px 12px; font-size: 0.65rem;
      }
      .code-panel {
        top: 56px; right: 16px; left: 16px;
        width: auto;
      }
      .controls { bottom: 80px; }
      .ctrl-btn { padding: 9px 16px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="nebula" id="nebula"></div>

  <div class="camera" id="camera">
    <div class="system" id="system">
      <div class="sun" id="sun">
        <div class="sun-core"></div>
        <div class="sun-glow"></div>
      </div>
      <!-- Orbits -->
      <div class="orbit" style="--orbit-period: 8s;  width: 200px; height: 200px;" data-orbit="mercury"><div class="planet planet-mercury" data-planet="mercury" data-name="Mercury"></div></div>
      <div class="orbit" style="--orbit-period: 14s; width: 300px; height: 300px;" data-orbit="venus"><div class="planet planet-venus" data-planet="venus" data-name="Venus"></div></div>
      <div class="orbit" style="--orbit-period: 20s; width: 410px; height: 410px;" data-orbit="earth"><div class="planet planet-earth" data-planet="earth" data-name="Earth"></div></div>
      <div class="orbit" style="--orbit-period: 28s; width: 530px; height: 530px;" data-orbit="mars"><div class="planet planet-mars" data-planet="mars" data-name="Mars"></div></div>
      <div class="orbit" style="--orbit-period: 50s; width: 700px; height: 700px;" data-orbit="jupiter"><div class="planet planet-jupiter" data-planet="jupiter" data-name="Jupiter"></div></div>
      <div class="orbit" style="--orbit-period: 75s; width: 880px; height: 880px;" data-orbit="saturn"><div class="planet planet-saturn" data-planet="saturn" data-name="Saturn"></div></div>
    </div>
  </div>

  <header class="hud">
    <h1>Cosmic System</h1>
    <div class="subtitle">Click a planet · Move mouse for parallax</div>
    <div class="stats">
      <div class="stat-pill"><span>STARS</span><b id="starCount">0</b></div>
      <div class="stat-pill"><span>FPS</span><b id="fps">--</b></div>
    </div>
  </header>

  <button class="view-code-btn" id="viewCodeBtn">⌨ View Code</button>
  <div class="code-panel" id="codePanel">
    <div class="code-header">
      <span>index.html</span>
      <button class="copy-btn" id="copyCodeBtn">Copy</button>
    </div>
    <pre id="codeContent"></pre>
  </div>

  <div class="info-panel" id="infoPanel">
    <button class="close-btn" id="closePanel" aria-label="Close">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>
    <div class="info-header">
      <div class="info-orb" id="infoOrb"></div>
      <div class="info-titles">
        <h2 id="infoName">--</h2>
        <div class="info-type" id="infoType">--</div>
      </div>
    </div>
    <div class="info-desc" id="infoDesc">--</div>
    <div class="info-stats" id="infoStats"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="warpBtn">
      <svg class="warp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Warp Speed
    </button>
    <button class="ctrl-btn" id="resetBtn" hidden>↺ Return</button>
  </div>

  <a class="back-btn" href="../../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to catalog
  </a>

  <script>
    (function() {
      'use strict';

      // ── Planet data ──
      const PLANETS = {
        mercury: {
          name: 'Mercury', type: 'Terrestrial · Class A',
          color: '#c4b5a0',
          desc: 'The smallest planet and closest to the Sun. A day on Mercury lasts 59 Earth days, while a year fits in just 88.',
          stats: { Diameter: '4 879 km', 'Distance': '57.9M km', Year: '88 days', Moons: '0' }
        },
        venus: {
          name: 'Venus', type: 'Terrestrial · Class B',
          color: '#e89856',
          desc: 'Hottest planet in the system. Its thick CO₂ atmosphere creates a runaway greenhouse effect — surface temps reach 465°C.',
          stats: { Diameter: '12 104 km', 'Distance': '108.2M km', Year: '225 days', Moons: '0' }
        },
        earth: {
          name: 'Earth', type: 'Terrestrial · Home',
          color: '#6cc4ff',
          desc: 'The pale blue dot. The only known place where life exists. 71% of the surface is liquid water.',
          stats: { Diameter: '12 742 km', 'Distance': '149.6M km', Year: '365.25 d', Moons: '1' }
        },
        mars: {
          name: 'Mars', type: 'Terrestrial · Class C',
          color: '#ff8a6a',
          desc: 'The red planet. Home to Olympus Mons — the tallest volcano in the solar system at 21.9 km high.',
          stats: { Diameter: '6 779 km', 'Distance': '227.9M km', Year: '687 days', Moons: '2' }
        },
        jupiter: {
          name: 'Jupiter', type: 'Gas Giant',
          color: '#d4a574',
          desc: 'The largest planet — more massive than all the others combined. Its Great Red Spot is a storm bigger than Earth, raging for 350+ years.',
          stats: { Diameter: '139 820 km', 'Distance': '778.5M km', Year: '11.9 years', Moons: '95' }
        },
        saturn: {
          name: 'Saturn', type: 'Gas Giant · Ringed',
          color: '#f0d8a0',
          desc: 'Famous for its spectacular ring system made of ice and rock. So low density it would float in water (if you had a big enough tub).',
          stats: { Diameter: '116 460 km', 'Distance': '1.43B km', Year: '29.5 years', Moons: '146' }
        }
      };

      // ── State ──
      const state = {
        focused: null,
        isWarping: false,
        mouseX: 0,
        mouseY: 0,
        targetX: 0,
        targetY: 0,
        warpEnd: 0,
        lastShootingStar: 0,
      };

      // Current camera/scale transform — tracked so we can reverse-engineer
      // the untransformed local position of any DOM element when re-focusing.
      const focus = { scale: 1, ox: 0, oy: 0, tx: 0, ty: 0 };

      // ── DOM refs ──
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      const camera = document.getElementById('camera');
      const system = document.getElementById('system');
      const nebula = document.getElementById('nebula');
      const warpBtn = document.getElementById('warpBtn');
      const resetBtn = document.getElementById('resetBtn');
      const infoPanel = document.getElementById('infoPanel');
      const closePanel = document.getElementById('closePanel');
      const viewCodeBtn = document.getElementById('viewCodeBtn');
      const codePanel = document.getElementById('codePanel');
      const codeContent = document.getElementById('codeContent');
      const copyCodeBtn = document.getElementById('copyCodeBtn');
      const starCountEl = document.getElementById('starCount');
      const fpsEl = document.getElementById('fps');
      const planets = document.querySelectorAll('.planet');

      // ── Starfield ──
      let stars = [];
      let shootingStars = [];
      const STAR_LAYERS = [
        { count: 220, depth: 0.3, size: [0.4, 0.9], speed: 0.3, color: '255, 240, 220' },
        { count: 140, depth: 0.6, size: [0.7, 1.4], speed: 0.6, color: '220, 230, 255' },
        { count:  60, depth: 1.0, size: [1.0, 2.0], speed: 1.0, color: '255, 255, 255' },
      ];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        initStars();
      }

      function initStars() {
        stars = [];
        const w = window.innerWidth;
        const h = window.innerHeight;
        STAR_LAYERS.forEach(layer => {
          for (let i = 0; i < layer.count; i++) {
            stars.push({
              x: Math.random() * w,
              y: Math.random() * h,
              r: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
              depth: layer.depth,
              twinklePhase: Math.random() * Math.PI * 2,
              twinkleSpeed: 0.4 + Math.random() * 1.6,
              color: layer.color,
            });
          }
        });
        starCountEl.textContent = stars.length;
      }

      function spawnShootingStar() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const fromLeft = Math.random() > 0.5;
        shootingStars.push({
          x: fromLeft ? -50 : w + 50,
          y: Math.random() * h * 0.6,
          vx: (fromLeft ? 1 : -1) * (8 + Math.random() * 6),
          vy: 1 + Math.random() * 2,
          life: 1.0,
          length: 80 + Math.random() * 60,
        });
      }

      let lastTime = performance.now();
      let frameTimes = [];
      function loop(now) {
        const dt = Math.min((now - lastTime) / 16.67, 3);
        lastTime = now;

        // FPS counter
        frameTimes.push(now);
        while (frameTimes.length > 60) frameTimes.shift();
        if (frameTimes.length > 5) {
          const fps = Math.round(1000 * (frameTimes.length - 1) / (frameTimes[frameTimes.length - 1] - frameTimes[0]));
          if (now - (loop._lastFps || 0) > 250) {
            fpsEl.textContent = fps;
            loop._lastFps = now;
          }
        }

        // Mouse parallax smoothing
        state.targetX += (state.mouseX - state.targetX) * 0.08;
        state.targetY += (state.mouseY - state.targetY) * 0.08;

        drawStars(dt, now);
        drawShootingStars(dt);

        // Shooting star spawn
        if (now - state.lastShootingStar > 6000 + Math.random() * 8000) {
          spawnShootingStar();
          state.lastShootingStar = now;
        }

        requestAnimationFrame(loop);
      }

      function drawStars(dt, now) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);

        const parallaxX = state.targetX * 30;
        const parallaxY = state.targetY * 30;
        const warpMode = state.isWarping;

        // Draw each star
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          let x = s.x - parallaxX * s.depth;
          let y = s.y - parallaxY * s.depth;
          // wrap
          if (x < 0) x += w; else if (x > w) x -= w;
          if (y < 0) y += h; else if (y > h) y -= h;

          const twinkle = 0.6 + 0.4 * Math.sin(now * 0.001 * s.twinkleSpeed + s.twinklePhase);
          const alpha = twinkle * (0.5 + 0.5 * s.depth);

          if (warpMode) {
            // streak from center outward
            const cx = w / 2 - parallaxX * s.depth;
            const cy = h / 2 - parallaxY * s.depth;
            const dx = x - cx;
            const dy = y - cy;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            const streakLen = s.depth * 60;
            const sx = cx + (dx / len) * Math.max(0, len - streakLen);
            const sy = cy + (dy / len) * Math.max(0, len - streakLen);
            const ex = cx + (dx / len) * len;
            const ey = cy + (dy / len) * len;

            const grd = ctx.createLinearGradient(sx, sy, ex, ey);
            grd.addColorStop(0, `rgba(${s.color}, 0)`);
            grd.addColorStop(1, `rgba(${s.color}, ${alpha})`);
            ctx.strokeStyle = grd;
            ctx.lineWidth = s.r * (1 + s.depth);
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(ex, ey);
            ctx.stroke();
          } else {
            ctx.fillStyle = `rgba(${s.color}, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x, y, s.r, 0, Math.PI * 2);
            ctx.fill();

            // glow for biggest stars
            if (s.r > 1.3) {
              ctx.fillStyle = `rgba(${s.color}, ${alpha * 0.15})`;
              ctx.beginPath();
              ctx.arc(x, y, s.r * 3, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }

      function drawShootingStars(dt) {
        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const s = shootingStars[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.life -= 0.012 * dt;

          if (s.life <= 0) { shootingStars.splice(i, 1); continue; }

          const grd = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 8, s.y - s.vy * 8);
          grd.addColorStop(0, `rgba(255, 255, 255, ${s.life})`);
          grd.addColorStop(1, `rgba(255, 255, 255, 0)`);
          ctx.strokeStyle = grd;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.vx * 8, s.y - s.vy * 8);
          ctx.stroke();
        }
      }

      // ── Camera: focus on planet ──
      function focusOnPlanet(name) {
        if (state.isWarping) return;
        const p = PLANETS[name];
        if (!p) return;
        const planetEl = document.querySelector(`.planet[data-planet="${name}"]`);
        if (!planetEl) return;

        // pause orbit rotation (idempotent)
        document.querySelectorAll('.orbit').forEach(o => {
          o.style.animationPlayState = 'paused';
        });

        // mark active
        planets.forEach(el => el.classList.toggle('active', el.dataset.planet === name));

        // Get the new planet's current VISUAL position
        const rect = planetEl.getBoundingClientRect();
        const vx = rect.left + rect.width / 2;
        const vy = rect.top + rect.height / 2;

        // Reverse the current camera+scale to get the planet's UNTRANSFORMED
        // local position in the system. This is where the new transform-origin
        // needs to point so the planet stays put when the scale animates.
        const localX = focus.ox + (vx - focus.tx - focus.ox) / focus.scale;
        const localY = focus.oy + (vy - focus.ty - focus.oy) / focus.scale;

        // Apply the new focus
        const newScale = name === 'jupiter' || name === 'saturn' ? 4 : 6;
        system.style.transformOrigin = `${localX}px ${localY}px`;
        system.style.transform = `scale(${newScale})`;
        system.classList.add('warping');
        setTimeout(() => system.classList.remove('warping'), 500);

        const tx = window.innerWidth / 2 - localX;
        const ty = window.innerHeight / 2 - localY;
        camera.style.transform = `translate(${tx}px, ${ty}px)`;
        camera.classList.add('warping');
        setTimeout(() => camera.classList.remove('warping'), 500);

        // Save the new transform state
        focus.scale = newScale;
        focus.ox = localX;
        focus.oy = localY;
        focus.tx = tx;
        focus.ty = ty;

        // populate panel
        document.getElementById('infoName').textContent = p.name;
        document.getElementById('infoType').textContent = p.type;
        document.getElementById('infoDesc').textContent = p.desc;
        const orb = document.getElementById('infoOrb');
        orb.style.background = `radial-gradient(circle at 30% 30%, #fff5, ${p.color} 40%, ${p.color}88 80%)`;
        orb.style.color = p.color;
        const statsEl = document.getElementById('infoStats');
        statsEl.innerHTML = Object.entries(p.stats).map(([k, v]) =>
          `<div class="stat"><div class="stat-label">${k}</div><div class="stat-value">${v}</div></div>`
        ).join('');

        // show
        infoPanel.classList.add('visible');
        resetBtn.hidden = false;
        warpBtn.hidden = true;
        state.focused = name;
      }

      function resetView() {
        document.querySelectorAll('.orbit').forEach(o => {
          o.style.animationPlayState = 'running';
        });
        planets.forEach(el => el.classList.remove('active'));
        system.style.transform = '';
        system.style.transformOrigin = '';
        camera.style.transform = '';
        focus.scale = 1;
        focus.ox = 0;
        focus.oy = 0;
        focus.tx = 0;
        focus.ty = 0;
        infoPanel.classList.remove('visible');
        resetBtn.hidden = true;
        warpBtn.hidden = false;
        state.focused = null;
      }

      // ── Warp effect ──
      function triggerWarp() {
        if (state.isWarping || state.focused) return;
        state.isWarping = true;
        document.body.classList.add('warp');
        state.warpEnd = performance.now() + 2200;
        setTimeout(() => {
          state.isWarping = false;
          document.body.classList.remove('warp');
        }, 2200);
      }

      // ── Planet clicks ──
      planets.forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          focusOnPlanet(el.dataset.planet);
        });
      });

      // Click on empty space resets
      document.addEventListener('click', (e) => {
        if (state.focused && !e.target.closest('.planet, .info-panel, .controls, .back-btn, .view-code-btn, .code-panel')) {
          resetView();
        }
      });

      closePanel.addEventListener('click', resetView);
      resetBtn.addEventListener('click', resetView);
      warpBtn.addEventListener('click', triggerWarp);

      // ── Mouse parallax ──
      document.addEventListener('mousemove', (e) => {
        state.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        state.mouseY = (e.clientY / window.innerHeight) * 2 - 1;
      });
      document.addEventListener('mouseleave', () => {
        state.mouseX = 0;
        state.mouseY = 0;
      });

      // ── Nebula parallax ──
      function updateNebula() {
        nebula.style.transform = `translate(${state.targetX * -12}px, ${state.targetY * -12}px)`;
        requestAnimationFrame(updateNebula);
      }
      updateNebula();

      // ── Keyboard ──
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (state.focused) resetView();
          else if (codePanel.classList.contains('open')) codePanel.classList.remove('open');
        }
        if (e.key === ' ' || e.key === 'w') {
          e.preventDefault();
          if (state.focused) resetView();
          else if (!state.isWarping) triggerWarp();
        }
      });

      // ── Code panel ──
      viewCodeBtn.addEventListener('click', () => {
        const isOpen = codePanel.classList.toggle('open');
        if (isOpen && !codeContent.textContent) {
          fetch('index.html').then(r => r.text()).then(html => {
            // strip the script content (huge) for readability
            const safe = html.replace(/<script[\s\S]*?<\/script>/g, '<!-- script -->');
            codeContent.textContent = safe;
          }).catch(() => {
            codeContent.textContent = 'Could not load source.';
          });
        }
        viewCodeBtn.textContent = isOpen ? '✕  Close' : '⌨  View Code';
      });

      copyCodeBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(codeContent.textContent).then(() => {
          copyCodeBtn.textContent = 'Copied!';
          setTimeout(() => { copyCodeBtn.textContent = 'Copy'; }, 1500);
        });
      });

      // ── Resize ──
      window.addEventListener('resize', resize);

      // ── Init ──
      resize();
      requestAnimationFrame(loop);

    })();
  </script>
</body>
</html>
