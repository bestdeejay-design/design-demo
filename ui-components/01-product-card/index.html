<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card — UI Component</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      margin: 0;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
      box-shadow: 0 2px 20px rgba(0,0,0,0.07);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.1);
    }

    /* ── Image ── */
    .card-image {
      position: relative;
      height: 260px;
      overflow: hidden;
      background: #f0f0f5;
      transition: background 0.4s ease;
    }
    .card-image .product-visual {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }
    .card:hover .product-visual {
      transform: scale(1.05);
    }
    .card-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: #ff4757;
      color: #fff;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      z-index: 2;
      box-shadow: 0 4px 12px rgba(255,71,87,0.3);
    }

    /* ── Heart / Wishlist ── */
    .wishlist-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      color: #c0c0c7;
      line-height: 1;
    }
    .wishlist-btn:hover {
      transform: scale(1.1);
      background: rgba(255,255,255,1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .wishlist-btn.liked {
      color: #ff4757;
    }
    .wishlist-btn:active {
      transform: scale(0.9);
    }
    @keyframes heartPop {
      0%   { transform: scale(1); }
      25%  { transform: scale(1.4); }
      50%  { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .wishlist-btn.animate {
      animation: heartPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ── Cart Badge ── */
    .cart-badge {
      position: absolute;
      top: 62px;
      right: 14px;
      z-index: 3;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: default;
      transition: transform 0.2s;
      color: #6c5ce7;
    }
    .cart-badge .count {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: #6c5ce7;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      transform: scale(0);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cart-badge .count.visible {
      transform: scale(1);
    }
    @keyframes countBump {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.5); }
      100% { transform: scale(1); }
    }
    .cart-badge .count.bump {
      animation: countBump 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ── Body ── */
    .card-body {
      padding: 20px 22px 22px;
    }
    .card-category {
      font-size: 0.7rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.35;
      color: #1d1d1f;
    }
    .card-rating {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-bottom: 16px;
    }
    .star {
      color: #ffc107;
      font-size: 0.85rem;
    }
    .star.empty { color: #ddd; }
    .rating-text {
      font-size: 0.78rem;
      color: #8e8e93;
      margin-left: 5px;
    }

    /* ── Color Swatches ── */
    .selector-group {
      margin-bottom: 14px;
    }
    .selector-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .color-swatches {
      display: flex;
      gap: 10px;
    }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      flex-shrink: 0;
    }
    .color-swatch:hover {
      transform: scale(1.12);
    }
    .color-swatch.active {
      border-color: #6c5ce7;
      box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
      transform: scale(1.1);
    }
    .color-swatch::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: inherit;
    }
    .color-swatch.check::before {
      content: '✓';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      z-index: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* ── Size Selector ── */
    .size-selector {
      display: flex;
      gap: 8px;
    }
    .size-btn {
      width: 44px;
      height: 36px;
      border-radius: 8px;
      border: 1.5px solid #e5e5ea;
      background: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      color: #3a3a3c;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .size-btn:hover {
      border-color: #c7c7cc;
      background: #f9f9fb;
    }
    .size-btn.active {
      border-color: #6c5ce7;
      background: #6c5ce7;
      color: #fff;
      box-shadow: 0 4px 12px rgba(108,92,231,0.25);
    }
    .size-btn:active {
      transform: scale(0.94);
    }

    /* ── Footer ── */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid #f0f0f5;
      margin-top: 6px;
    }
    .price-area {
      display: flex;
      flex-direction: column;
    }
    .card-price {
      font-size: 1.4rem;
      font-weight: 800;
      color: #1d1d1f;
      line-height: 1.2;
    }
    .card-price .old {
      font-size: 0.8rem;
      font-weight: 400;
      color: #8e8e93;
      text-decoration: line-through;
      margin-left: 6px;
    }
    .card-btn {
      background: #6c5ce7;
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    .card-btn:hover {
      background: #5a4bd1;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(108,92,231,0.3);
    }
    .card-btn:active {
      transform: translateY(0) scale(0.97);
    }
    .card-btn.added {
      background: #00b894;
      pointer-events: none;
    }

    /* ── View Code ── */
    .view-code-btn {
      background: transparent;
      border: 1.5px solid #e5e5ea;
      color: #6e6e73;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      width: 100%;
    }
    .view-code-btn:hover {
      border-color: #6c5ce7;
      color: #6c5ce7;
      background: rgba(108,92,231,0.04);
    }
    .code-panel {
      width: 100%;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
      opacity: 0;
      background: #1d1d1f;
      border-radius: 14px;
    }
    .code-panel.open {
      max-height: 2000px;
      opacity: 1;
    }
    .code-panel pre {
      padding: 20px;
      font-size: 0.72rem;
      line-height: 1.6;
      color: #e5e5ea;
      overflow-x: auto;
      white-space: pre;
      tab-size: 2;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    .code-panel .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 0;
      font-size: 0.7rem;
      color: #8e8e93;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .code-panel .code-header .copy-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #8e8e93;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s;
    }
    .code-panel .code-header .copy-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #1d1d1f;
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .toast.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .toast .toast-icon {
      font-size: 1rem;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card-body { padding: 16px 18px 18px; }
      .card-image { height: 210px; }
      .card-title { font-size: 1.05rem; }
      .card-price { font-size: 1.25rem; }
      .card-btn { padding: 10px 18px; font-size: 0.8rem; }
      .code-panel pre { font-size: 0.65rem; padding: 14px; }
      .toast { font-size: 0.8rem; padding: 10px 18px; }
    }
    .back-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 100px;
      color: #1c1c1e;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .back-btn svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card" id="productCard">
      <!-- Image -->
      <div class="card-image" id="productImage">
        <img src="assets/product.jpg" alt="Wireless Headphones Pro Max" class="product-visual" id="productVisual" style="width:100%;height:100%;object-fit:cover;">
        <span class="card-badge">-30%</span>
        <button type="button" class="wishlist-btn" id="wishlistBtn" aria-label="Add to wishlist">♡</button>
        <div class="cart-badge" id="cartBadge">
          🛒
          <span class="count" id="cartCount">0</span>
        </div>
      </div>

      <!-- Body -->
      <div class="card-body">
        <div class="card-category">Electronics</div>
        <div class="card-title">Wireless Headphones Pro Max</div>

        <!-- Rating -->
        <div class="card-rating">
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star empty">★</span>
          <span class="rating-text">4.2 (128 reviews)</span>
        </div>

        <!-- Color -->
        <div class="selector-group">
          <div class="selector-label">Color</div>
          <div class="color-swatches" id="colorSwatches">
            <div class="color-swatch active check" style="background:#6c5ce7" data-color="purple"></div>
            <div class="color-swatch" style="background:#2d3436" data-color="black"></div>
            <div class="color-swatch" style="background:#0984e3" data-color="blue"></div>
            <div class="color-swatch" style="background:#e17055" data-color="coral"></div>
            <div class="color-swatch" style="background:#00b894" data-color="green"></div>
          </div>
        </div>

        <!-- Size -->
        <div class="selector-group">
          <div class="selector-label">Size</div>
          <div class="size-selector" id="sizeSelector">
            <button type="button" class="size-btn" data-size="S">S</button>
            <button type="button" class="size-btn active" data-size="M">M</button>
            <button type="button" class="size-btn" data-size="L">L</button>
          </div>
        </div>

        <!-- Footer -->
        <div class="card-footer">
          <div class="price-area">
            <div class="card-price">$79.99 <span class="old">$114.99</span></div>
          </div>
          <button type="button" class="card-btn" id="addToCartBtn">Add to Cart</button>
        </div>
      </div>
    </div>

    <!-- View Code -->
    <button type="button" class="view-code-btn" id="viewCodeBtn">⌨  View Code</button>
    <div class="code-panel" id="codePanel">
      <div class="code-header">
        <span>index.html</span>
        <button type="button" class="copy-btn" id="copyCodeBtn">Copy</button>
      </div>
      <pre id="codeContent"></pre>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function() {
      'use strict';

      // ── State ──
      const state = {
        cartCount: 0,
        liked: false,
        selectedColor: 'purple',
        selectedSize: 'M',
        isToastVisible: false,
      };

      // ── DOM refs ──
      const wishlistBtn = document.getElementById('wishlistBtn');
      const cartCountEl = document.getElementById('cartCount');
      const addBtn = document.getElementById('addToCartBtn');
      const productVisual = document.getElementById('productVisual');
      const colorSwatches = document.getElementById('colorSwatches');
      const sizeSelector = document.getElementById('sizeSelector');
      const viewCodeBtn = document.getElementById('viewCodeBtn');
      const codePanel = document.getElementById('codePanel');
      const codeContent = document.getElementById('codeContent');
      const copyBtn = document.getElementById('copyCodeBtn');
      const toastContainer = document.getElementById('toastContainer');

      // ── Color → gradient / emoji map ──
      const colorMap = {
        purple: { bg: 'linear-gradient(135deg, #6c5ce7, #a29bfe)', emoji: '🎧' },
        black:  { bg: 'linear-gradient(135deg, #2d3436, #636e72)', emoji: '🎧' },
        blue:   { bg: 'linear-gradient(135deg, #0984e3, #74b9ff)', emoji: '🎧' },
        coral:  { bg: 'linear-gradient(135deg, #e17055, #fab1a0)', emoji: '🎧' },
        green:  { bg: 'linear-gradient(135deg, #00b894, #55efc4)', emoji: '🎧' },
      };

      // ── Wishlist ──
      wishlistBtn.addEventListener('click', function() {
        state.liked = !state.liked;
        this.classList.remove('animate');
        // force reflow
        void this.offsetWidth;
        this.classList.add('animate');
        this.classList.toggle('liked', state.liked);
        this.textContent = state.liked ? '♥' : '♡';
      });

      // ── Cart ──
      addBtn.addEventListener('click', function() {
        state.cartCount += 1;
        cartCountEl.textContent = state.cartCount;

        // badge visibility + bump
        cartCountEl.classList.add('visible');
        cartCountEl.classList.remove('bump');
        void cartCountEl.offsetWidth;
        cartCountEl.classList.add('bump');

        // button feedback
        this.textContent = '✓ Added';
        this.classList.add('added');
        setTimeout(() => {
          this.textContent = 'Add to Cart';
          this.classList.remove('added');
        }, 1500);

        showToast(state.cartCount);
      });

      function showToast(count) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span class="toast-icon">🛒</span> Added to cart! (${count} item${count !== 1 ? 's' : ''})`;
        toastContainer.appendChild(toast);
        // force reflow then show
        void toast.offsetWidth;
        toast.classList.add('visible');

        // auto-remove after 2.2s
        setTimeout(() => {
          toast.classList.remove('visible');
          toast.addEventListener('transitionend', () => toast.remove(), { once: true });
          // fallback
          setTimeout(() => { if (toast.parentNode) toast.remove(); }, 400);
        }, 2200);
      }

      // ── Color Swatches ──
      colorSwatches.querySelectorAll('.color-swatch').forEach(function(swatch) {
        swatch.addEventListener('click', function() {
          colorSwatches.querySelectorAll('.color-swatch').forEach(function(s) {
            s.classList.remove('active', 'check');
          });
          this.classList.add('active', 'check');
          const color = this.dataset.color;
          state.selectedColor = color;
          const cfg = colorMap[color];
          if (cfg) {
            productVisual.textContent = cfg.emoji;
          }
        });
      });

      // ── Size Selector ──
      sizeSelector.querySelectorAll('.size-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          sizeSelector.querySelectorAll('.size-btn').forEach(function(b) {
            b.classList.remove('active');
          });
          this.classList.add('active');
          state.selectedSize = this.dataset.size;
        });
      });

      // ── View Code ──
      let codeVisible = false;
      viewCodeBtn.addEventListener('click', function() {
        codeVisible = !codeVisible;
        codePanel.classList.toggle('open', codeVisible);
        this.textContent = codeVisible ? '⌨  Hide Code' : '⌨  View Code';

        if (codeVisible && !codeContent.dataset.loaded) {
          codeContent.textContent = getPageSource();
          codeContent.dataset.loaded = 'true';
        }
      });

      function getPageSource() {
        return '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      }

      // ── Copy Code ──
      copyBtn.addEventListener('click', function() {
        const text = codeContent.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() {
            copyBtn.textContent = '✓ Copied';
            setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);
          });
        } else {
          // fallback
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          copyBtn.textContent = '✓ Copied';
          setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);
        }
      });

      // ── Initial load code content (lazy) ──
      // We'll prime it on first open, but also allow manual trigger
    })();
  </script>
  <a href="../../index.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Catalog
  </a>
</body>
</html>
