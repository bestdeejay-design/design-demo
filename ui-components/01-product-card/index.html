<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card — UI Component</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      width: 320px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    .card-image {
      position: relative;
      height: 240px;
      background: #f0f0f5;
      overflow: hidden;
    }
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card:hover .card-image img {
      transform: scale(1.05);
    }
    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #ff4757;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .card-body {
      padding: 20px;
    }
    .card-category {
      font-size: 0.8rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .card-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }
    .star {
      color: #ffc107;
      font-size: 0.9rem;
    }
    .star.empty { color: #ddd; }
    .rating-text {
      font-size: 0.8rem;
      color: #8e8e93;
      margin-left: 4px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid #f0f0f5;
    }
    .card-price {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .card-price span {
      font-size: 0.85rem;
      font-weight: 400;
      color: #8e8e93;
      text-decoration: line-through;
      margin-left: 8px;
    }
    .card-btn {
      background: #6c5ce7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .card-btn:hover { background: #5a4bd1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-image">
      <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1rem;">
        Product Image
      </div>
      <span class="card-badge">-30%</span>
    </div>
    <div class="card-body">
      <div class="card-category">Electronics</div>
      <div class="card-title">Wireless Headphones Pro Max</div>
      <div class="card-rating">
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star empty">★</span>
        <span class="rating-text">4.2 (128 reviews)</span>
      </div>
      <div class="card-footer">
        <div class="card-price">$79.99 <span>$114.99</span></div>
        <button class="card-btn">Add to Cart</button>
      </div>
    </div>
  </div>
</body>
</html>
