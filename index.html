<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Demo — UI/UX catalog of solutions</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236c5ce7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>">
  <meta name="description" content="Catalog of UI/UX solutions, components, and design patterns.">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Design Demo</h1>
      <p>Catalog of UI/UX solutions, components, and design patterns.<br>Each example is a live demo with a description.</p>
    </header>

    <div class="sections-grid" id="catalog">
      <!-- Sections are rendered by sections.js -->
    </div>

    <footer class="footer">
      <a href="https://github.com/bestdeejay-design/design-demo" style="color: var(--text2);">GitHub</a>
      &middot; Сделано с ❤️
    </footer>
  </div>

  <script src="assets/js/sections.js"></script>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sunIcon"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="moonIcon" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <script>
    (function() {
      const toggle = document.getElementById('themeToggle');
      const sun = document.getElementById('sunIcon');
      const moon = document.getElementById('moonIcon');
      const stored = localStorage.getItem('design-demo-theme');
      const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      let theme = stored || (sysDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);

      if (theme === 'dark') { sun.style.display = 'none'; moon.style.display = ''; }
      else { sun.style.display = ''; moon.style.display = 'none'; }

      toggle.addEventListener('click', function() {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('design-demo-theme', next);
        if (next === 'dark') { sun.style.display = 'none'; moon.style.display = ''; }
        else { sun.style.display = ''; moon.style.display = 'none'; }
      });
    })();
  </script>
</body>
</html>
